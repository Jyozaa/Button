<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Button</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <div id="btn-wrap">
    <button id="btn" type="button" aria-label="Button"><span id="label">Click</span></button>
    <svg id="ring" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <circle id="ring-bg" cx="60" cy="60" r="54"></circle>
      <circle id="ring-fg" cx="60" cy="60" r="54"></circle>
    </svg>
  </div>
</div>
<script src="script.js" defer></script>
</body>
</html>
